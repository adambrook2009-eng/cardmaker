<!doctype html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ebdd" />
    <script>
      // Тема до загрузки интерфейса — чтобы не мелькала другая
      try {
        var th = localStorage.getItem('cardmaker.theme');
        if (th !== 'beige' && th !== 'dark') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'beige';
        document.documentElement.dataset.theme = th;
      } catch (e) {}
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифты с поддержкой кириллицы и иврита (без сети — системный фолбэк) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&family=Amatic+SC:wght@700&family=Caveat:wght@700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Открытки</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
